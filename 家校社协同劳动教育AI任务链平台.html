/* ========================================================= 数据层（后端 API 持久化 + 实时同步）
   设计要点：
   - 服务端 data/db.json 为唯一权威数据库，跨设备/跨端共享，持久化落盘。
   - 前端不再以 localStorage 为主数据源；仅在其作为「离线兜底」时读取。
   - 任意数据变更后 save() 推送到后端，后端广播 SSE，所有在线端自动重渲染。 */
let DB=null;
let API_OK=true;
let _saveTimer=null;

async function apiGetDB(){
  const r=await fetch('/api/db',{cache:'no-store'});
  if(!r.ok) throw new Error('http '+r.status);
  return await r.json();
}
async function apiPushDB(){
  const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)});
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}
// 登录/进入各端时，把账号登记到云端 users 集合（便于跨设备识别同一账号）。失败不阻塞前端。
async function apiLogin(payload){
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){ return {ok:false}; }
}
function save(){
  // 业务数据只落云端（CloudBase 云数据库）；前端不再写入 localStorage，避免账号/任务数据留在本机
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    apiPushDB().then(()=>setAPI(true)).catch(()=>setAPI(false));
  },120);
}
async function load(){
  try{
    const d=await apiGetDB();
    if(d && d.__needSeed){ DB=seed(); try{ await apiPushDB(); }catch(_){ } setAPI(true); }
    else if(d && d.tasks){ DB=d; setAPI(true); }
    else { DB=seed(); setAPI(true); }
  }catch(e){
    // 服务器不可达：仅内存兜底（不写 localStorage，避免业务数据落本地），并提示用户
    DB=seed(); setAPI(false);
  }
  if(!DB.tasks) DB=seed();
}
function setAPI(ok){
  if(API_OK===ok) return; API_OK=ok;
  let b=document.getElementById('apiBar');
  if(!b){ b=document.createElement('div'); b.id='apiBar'; b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;font-size:13px;padding:6px;'; document.body.appendChild(b); }
  if(ok){ b.style.display='none'; }
  else { b.style.display='block'; b.style.background='#fff3cd'; b.style.color='#856404'; b.style.borderBottom='1px solid #ffe69c'; b.textContent='⚠️ 暂时无法连接云端服务器，当前显示的是演示缓存数据。请确认 CloudBase 云托管服务已正常运行。'; }
}
// 登录/进入页面时，主动从后端拉取该账号对应的最新数据
function refreshDB(cb){
  apiGetDB().then(d=>{ if(d&&d.tasks){ DB=d; if(!DB.tasks)DB=seed(); setAPI(true);} }).catch(()=>{}).finally(()=>{ if(cb) cb(); });
}
// 实时同步：监听后端广播，任一端数据变更后本端自动重载并重渲染（无需手动刷新）
function bindSync(){
  if(typeof EventSource==='undefined') return;
  const es=new EventSource('/api/events');
  es.onmessage=ev=>{
    try{ const m=JSON.parse(ev.data); if(m&&m.type==='changed'){ apiGetDB().then(d=>{ if(d&&d.tasks){ DB=d; if(!DB.tasks)DB=seed(); relayoutAll(); } }).catch(()=>{}); } }catch(_){}
  };
  es.onerror=()=>{ /* 浏览器会自动重连 */ };
}

/* 跨端实时同步：任一端数据变更后，重渲染所有“已登录/可见”的端面板。
   三端共用同一内存 DB，但各自面板只在被渲染时刷新，因此必须主动重渲染。 */
function relayoutAll(){
  // 若某端面板内正有输入框聚焦（用户正在打字），不重渲染该端，避免清空已输入内容
  const editing=(id)=>{ const el=document.activeElement; if(!el)return false; const b=$(id); if(!b||!b.contains(el))return false; const t=el.tagName; return t==='INPUT'||t==='TEXTAREA'||el.isContentEditable; };
  if($('parentApp')&&$('parentApp').style.display!=='none'&&P.user&&!editing('parentBody')){
    if(!P.tab)P.tab='home'; renderParent();
  }
  if($('schoolApp')&&$('schoolApp').style.display!=='none') renderSchool();
  if($('commApp')&&$('commApp').style.display!=='none') renderComm();
}

/* 雷达图（六边形 SVG · 带刻度与轴标签） */
function radarSVG(vals){ // vals: [道德认知,行为表现,价值内化,家庭评价,学校评价,社区评价] 0-100
  const cx=150,cy=130,R=92,N=6;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let grid='';[0.25,0.5,0.75,1].forEach(k=>{let p='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*k);p+=x.toFixed(1)+','+y.toFixed(1)+' ';}grid+='<polygon points="'+p+'" fill="'+(k===1?'#f6fbf8':'none')+'" stroke="#dfe6ee" stroke-width="1"/>';});
  let axis='';for(let i=0;i<N;i++){const[x,y]=pt(i,R);axis+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#e3e9f0"/>';}
  let ticks='<text x="'+(cx+7)+'" y="'+(cy-3)+'" font-size="9" fill="#b3bcc8">0</text>';
  [25,50,75,100].forEach(v=>{const[x,y]=pt(1,R*v/100);ticks+='<text x="'+(x+9)+'" y="'+(y+3)+'" font-size="9" fill="#b3bcc8">'+v+'</text>';});
  let poly='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*Math.max(8,vals[i])/100);poly+=x.toFixed(1)+','+y.toFixed(1)+' ';}
  let labs='';const names=['道德认知','行为表现','价值内化','家庭评价','学校评价','社区评价'];
  for(let i=0;i<N;i++){const[x,y]=pt(i,R+18);labs+='<text x="'+x+'" y="'+(y+4)+'" font-size="11" text-anchor="middle" fill="#5b6675">'+names[i]+'</text>';}
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 262" style="width:100%;max-width:330px;display:block;margin:0 auto">'+grid+axis+
    '<polygon points="'+poly+'" fill="rgba(47,168,102,.30)" stroke="#2fa866" stroke-width="2"/>'+
    vals.map((v,i)=>{const[x,y]=pt(i,R*Math.max(8,v)/100);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="#2fa866"/>';}).join('')+
    labs+ticks+'</svg>';
}
/* 雷达图转 PNG（用于导出 Word 内嵌图片，含中文标签用 Blob URL 避免编码问题） */
function radarPng(vals){
  return new Promise(resolve=>{
    const svgStr=radarSVG(vals).replace('<svg ','<svg width="600" height="524" ').replace(/style="[^"]*"/,'');
    const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas');c.width=600;c.height=524;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,600,524);ctx.drawImage(img,0,0,600,524);
      try{resolve(c.toDataURL('image/png'));}catch(e){resolve('');} URL.revokeObjectURL(url); };
    img.onerror=()=>{resolve('');URL.revokeObjectURL(url);};
    img.src=url;
  });
}

/* ========================================================= 统计计算 */
function recsOf(cls,name){ return DB.records.filter(r=>r.cls===cls&&(!name||r.student===name)); }
function evalOf(recordId,role){ return DB.evals.find(e=>e.recordId===recordId&&e.role===role); }
function avgStarsRole(list,role){ const st=list.map(r=>{const e=evalOf(r.id,role);return e?e.stars:null;}).filter(v=>v!=null); return st.length?st.reduce((a,b)=>a+b,0)/st.length:null; }
function gradeVal(g){ return {A:95,B:80,C:65,D:48}[g]||60; }
function catScores(list){ // 三项能力 0-100
  const withAI=list.filter(r=>r.ai&&r.ai.dims);
  if(!withAI.length) return {道德认知:60,行为表现:60,价值内化:60};
  const pick=(names)=>{let s=0,n=0;withAI.forEach(r=>names.forEach(nm=>{const d=r.ai.dims.find(x=>x.name===nm);if(d){s+=gradeVal(d.grade);n++;}}));return n?Math.round(s/n):60;};
  return {
    道德认知:pick(['政治认同','道德修养','法治观念','健全人格','责任担当']),
    行为表现:pick(['劳动观念','劳动能力','劳动习惯与品质','劳动精神','协作沟通','创新实践','安全规范']),
    价值内化:pick(['服务成效','诚信真实'])
  };
}
function bigStats(list){ // 总劳动时长 / 已完成 x/y / 平均自评分
  const dur=list.reduce((a,r)=>a+(+r.duration||0),0);
  const done=list.filter(r=>r.status==='已确认').length;
  const self=avgStarsRole(list,'学生');
  return {dur, done, total:list.length, self: self==null?null:self};
}
function threeStars(list){
  return { 家庭:avgStarsRole(list,'家长'), 学校:avgStarsRole(list,'教师'), 社区:avgStarsRole(list,'社区') };
}
function radarVals(list){
  const c=catScores(list), s=threeStars(list);
  return [c.道德认知,c.行为表现,c.价值内化, (s.家庭??3)*20, (s.学校??3)*20, (s.社区??3)*20];
}

  const dur=+$('erDur').value; if(!dur||dur<=0){toast('请填写有效时长','warn');return;}
  const desc=$('erDesc').value.trim(); if(!desc){toast('请填写劳动说明','warn');return;}
  r.duration=dur;r.date=$('erDate').value;r.desc=desc;
  if(canStatus)r.status=$('erStatus').value;
  save();hide('modal');toast('记录修改成功','ok');
  if(P.user)renderParent(); renderSchool(); renderComm();
}
function delRec(id){
  confirmBox('确定删除这条服务记录吗？关联的星级评价仍保留，记录删除后不可恢复。',()=>{
    DB.records=DB.records.filter(x=>x.id!==id);save();toast('记录已删除','ok');
    if(P.user)renderParent(); renderSchool(); renderComm();
  });
}

/* 渲染一条记录的所有附件（图片可点开放大、视频可播放、文档可点开说明） */
function mediaHTML(r){
  if(!r.media||!r.media.length)return '';
  return '<div class="imgrow" style="margin-top:6px">'+
    r.media.map((m,i)=>'<div class="im">'+(m.kind==='img'?'<img src="'+m.url+'" onclick="mediaLightbox(\''+r.id+'\','+i+')">' : (m.kind==='video'?'<video src="'+m.url+'" controls preload="metadata" style="width:110px;height:80px;object-fit:cover;border-radius:8px"></video>' : '<div class="docbadge" onclick="mediaLightbox(\''+r.id+'\','+i+')">📄<br>'+esc((m.name||'文档').slice(0,10))+'</div>'))+'</div>').join('')+'</div>';
}
function mediaLightbox(rid,i){
  const r=DB.records.find(x=>x.id===rid); if(!r||!r.media||!r.media[i])return;
  const m=r.media[i];
  if(m.kind==='img'){ $('lightboxImg').src=m.url; show('lightbox'); }
  else if(m.kind==='video'){ modal('<h3>🎬 视频预览</h3><video src="'+m.url+'" controls style="max-width:100%;max-height:70vh"></video><div style="text-align:right;margin-top:8px"><button class="btn sm gray" onclick="hide(\'modal\')">关闭</button></div>'); }
  else { modal('<h3>📄 文档预览</h3><p style="font-size:13px">'+esc(m.name||'文档')+'</p><p class="mini">本地预览环境无法直接打开文档，请下载后在 Word / PDF / WPS 等软件中查看。</p><div style="text-align:right"><button class="btn sm gray" onclick="hide(\'modal\')">关闭</button></div>'); }
}

function lightbox(id,i){ const j=DB.jobs.find(x=>x.id===id); $('lightboxImg').src=j.images[i]; show('lightbox'); }
function applyJob(id){
  const j=DB.jobs.find(x=>x.id===id);
  if(DB.signups.some(s=>s.jobId===id&&s.student===P.user.name&&s.status!=='已拒绝')){toast('该岗位已报名，请勿重复报名','warn');return;}
  DB.signups.push({id:uid('S'),jobId:id,jobName:j.name,student:P.user.name,cls:P.user.cls,status:'待审核',createdAt:new Date().toISOString().slice(0,10)});
  j.signed++; if(j.signed>=j.need)j.status='已满员';
  save();hide('modal');toast('报名成功，等待社区审核','ok');renderParent();
}

  '<div class="imgrow" id="upPrev"></div>'+
  '<div class="priv-must"><input type="checkbox" id="upMask"><span>我已确认：素材已遮挡未成年人面部，仅用于本校课题教学评价与教研存档。</span></div>'+
  '<div style="text-align:center;margin-top:10px"><button class="btn" onclick="uploadRecord()">提交服务记录</button></div></div>';
  h+='<div class="card"><h4>🗂️ 服务记录列表（本端上传 + 社区端上传）</h4>'+(list.length?list.map(taskCardHTML).join(''):'<div class="empty">暂无记录</div>')+'</div>';
  return h;

function pickFiles(inp){
  const files=[...inp.files]; if(!files.length)return;
  files.forEach(f=>{
    const kind=f.type.startsWith('image')?'img':(f.type.startsWith('video')?'video':'doc');
    if(kind==='img'&&f.size<800*1024){
      const rd=new FileReader(); rd.onload=e=>{_upMedia.push({kind,name:f.name,url:e.target.result});drawPrev();}; rd.readAsDataURL(f);
    }else{
      _upMedia.push({kind,name:f.name,url:URL.createObjectURL(f),temp:true}); drawPrev();
    }
  });
  inp.value='';
}
function drawPrev(){
  $('upPrev').innerHTML=_upMedia.map((m,i)=>'<div class="im">'+(m.kind==='img'?'<img src="'+m.url+'">':'<div style="width:110px;height:80px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;background:#f4f7fb;text-align:center;padding:4px;word-break:break-all">'+(m.kind==='video'?'🎬 ':'📄 ')+esc(m.name.slice(0,14))+'</div>')+'<button class="del" onclick="_upMedia.splice('+i+',1);drawPrev()">✕</button></div>').join('');
}
function uploadRecord(){
  const tn=$('upTask').value; if(!tn){toast('暂无可关联的任务','warn');return;}
  if(!$('upMask').checked){toast('请先勾选隐私确认：素材须遮挡面部','err');return;}
  const desc=$('upDesc').value.trim(); if(!desc){toast('请填写劳动说明','warn');return;}
  const dur=+$('upDur').value; if(!dur||dur<=0){toast('请填写有效劳动时长','warn');return;}
  const isJob=DB.signups.some(s=>s.jobName===tn&&s.student===P.user.name);
  DB.records.unshift({id:uid('R'),student:P.user.name,cls:P.user.cls,school:P.user.school,taskName:tn,layer:isJob?'社区服务层':(DB.tasks.find(t=>t.name===tn)||{}).layer||'家庭实践层',source:isJob?'job':'task',duration:dur,date:$('upDate').value,desc,media:_upMedia.slice(),status:'待审核',ai:null,uploader:'家长'});
  _upMedia=[];save();toast('提交成功！等待教师审核','ok');P.page=1;renderParent();
}

/* 家长端：班级/年级匹配 + 任务操作弹窗（上传服务记录 / 星级评价） */
function clsMatch(cls,grade,target){
  if(!cls||!target)return false;
  if(cls==='全年级'){ if(grade&&grade===target[0])return true; if(!grade)return true; return false; }
  const full = cls.indexOf('年级')>=0 ? cls : (grade||'')+'年级'+cls;
  return full===target;
}
function pClassMatch(cls,grade){ return clsMatch(cls,grade,P.user.cls); }
function pFitMatch(fit){ if(!fit||fit==='不限')return true; const g=P.user.cls[0]; if(fit.endsWith('年级'))return fit[0]===g; const m=fit.match(/(\d+)\s*-\s*(\d+)年级?/); if(m)return +g>=+m[1]&&+g<=+m[2]; return true; }
function findMyRecord(taskName,isJob){ return DB.records.find(r=>r.student===P.user.name&&r.taskName===taskName&&(isJob?r.source==='job':r.uploader==='家长'))||DB.records.find(r=>r.student===P.user.name&&r.taskName===taskName); }

function aiDims(t){ // AI 依据学段特点配置维度与权重
  const low=+t.grade<=2, mid=+t.grade<=4;
  let base;
  if(t.layer==='课堂认知层') base=['政治认同','道德修养','劳动观念','劳动精神','责任担当'];
  else if(t.layer==='家庭实践层') base=['劳动能力','劳动习惯与品质','责任担当','安全规范','诚信真实'];
  else base=['劳动能力','协作沟通','创新实践','安全规范','服务成效','诚信真实'];
  if(!low) base.push('法治观念'); if(mid&&!low) base.push('健全人格');
  const w=[30,25,20,15,10,8,5].slice(0,base.length); const sum=w.reduce((a,b)=>a+b,0);
  t.dims=base.map((n,i)=>({name:n,weight:Math.round(w[i]/sum*100)}));
}

function runAI(id,redo){

  const dims=DIMS14.slice(0,8).map((n,i)=>({name:n,grade:g(i)}));

async function exportAll(){
  const map={};
  DB.records.forEach(r=>{const k=r.cls+'|'+r.student;(map[k]=map[k]||{cls:r.cls,name:r.student,list:[]}).list.push(r);});

  if(!students.length){toast('暂无学生数据可导出','warn');return;}
  toast('正在生成报告（含六维雷达图）…','ok');
  const reports=[];
  for(const s of students){
    const png=await radarPng(radarVals(s.list));
    reports.push(buildStudentReport(s.name,s.cls,s.list,png));
  }
  const html='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:"Microsoft YaHei";font-size:12pt}</style></head><body>'+
    reports.join('')+'</body></html>';
  const blob=new Blob(['\ufeff'+html],{type:'application/msword'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='综合素质总评_'+new Date().toISOString().slice(0,10)+'.doc';
  a.click();
  toast('已导出 '+students.length+' 名学生的综合素质总评文档（含六维雷达图）','ok');
}

function drawJobPrev(){
  const box=$('jPrev'); if(!box)return;
  box.innerHTML=C.jobImgs.map((u,i)=>'<div class="im"><img src="'+u+'"><button class="del" onclick="C.jobImgs.splice('+i+',1);drawJobPrev()">✕</button></div>').join('');
}
function saveJob(){
  const name=$('jName').value.trim(); if(!name){toast('请填写岗位名称','warn');return;}
  const need=+$('jNeed').value; if(!need||need<1){toast('请填写有效所需人数','warn');return;}
  const data={name,org:$('jOrg').value.trim(),address:$('jAddr').value.trim(),time:$('jTime').value.trim(),type:$('jType').value.trim(),fit:$('jFit').value.trim()||'不限',skills:$('jSkill').value.trim(),safety:$('jSafe').value.trim(),contact:$('jContact').value.trim(),deadline:$('jDl').value};
  if(C.editJobId){
    const j=DB.jobs.find(x=>x.id===C.editJobId);
    Object.assign(j,data,{images:C.jobImgs.slice()});
    if(j.signed>=j.need)j.status='已满员'; else if(j.status==='已满员')j.status='招募中';
    toast('岗位已修改并同步家长端','ok');
  }else{
    DB.jobs.unshift({id:uid('J'),...data,need,signed:0,status:'招募中',owner:OWNER,images:C.jobImgs.slice(),createdAt:new Date().toISOString().slice(0,10)});
    toast('岗位发布成功，已同步家长端','ok');
  }
  C.editJobId=null;C.jobImgs=[];save();renderComm();
}
function cMy(){
  const mine=DB.jobs.filter(j=>j.owner===OWNER);
  const per=4,pg=mine.slice((C.page-1)*per,C.page*per);
  let h='<div class="privacy-tip">🧑‍💼 权限说明：社区人员只能新增、修改、删除<b>自己发布</b>的岗位。</div>';
  h+='<div class="card"><h4>🏘️ 我发布的岗位</h4>'+(pg.length?'':'<div class="empty">还没有发布过岗位</div>');
  pg.forEach(j=>{
    h+='<div class="tcard"><div class="tt"><b>'+esc(j.name)+'</b>'+statusTag(j.status)+'</div>'+
    '<div class="meta"><span>👥 '+j.signed+'/'+j.need+'</span><span>📅 截止 '+esc(j.deadline)+'</span><span>🖼 '+(j.images&&j.images.length?j.images.length+' 张参考图':'无图')+'</span><span class="tag done">✅ 已完成 '+DB.records.filter(r=>r.jobId===j.id&&r.status==='已确认').length+' 人</span></div>'+
    '<div style="margin-top:6px"><button class="btn sm" onclick="jobDetail(\''+j.id+'\',false)">详情</button> <button class="btn sm orange" onclick="editJob(\''+j.id+'\')">编辑</button> <button class="btn sm red" onclick="delJob(\''+j.id+'\')">删除</button></div></div>';
  });
  h+=pagerHTML(C.page,mine.length,per,'C.page')+'</div>';
  return h;
}
function editJob(id){
  C.editJobId=id; C.jobImgs=(DB.jobs.find(j=>j.id===id).images||[]).slice();
  cTab('post',document.querySelector('#commTabs button[data-t=post]'));
  setTimeout(drawJobPrev,50);
}
function delJob(id){
  const j=DB.jobs.find(x=>x.id===id);
  confirmBox('确定删除岗位【'+esc(j.name)+'】吗？相关报名信息将无法查看，不可恢复。',()=>{
    DB.jobs=DB.jobs.filter(x=>x.id!==id);save();toast('岗位已删除','ok');renderComm();
  });
}
function cAudit(){
  const mineIds=DB.jobs.filter(j=>j.owner===OWNER).map(j=>j.id);
  const list=DB.signups.filter(s=>mineIds.includes(s.jobId));
  const per=5,pg=list.slice((C.auditPage-1)*per,C.auditPage*per);
  let h='<div class="card"><h4>📝 报名审核（通过后生成服务任务单）</h4>'+(pg.length?'':'<div class="empty">暂无报名</div>');
  pg.forEach(s=>{
    const ord='RW-'+s.id.slice(1);
    h+='<div class="tcard"><div class="tt"><b>'+esc(s.student)+'</b><span class="mini">'+esc(s.cls)+'</span>'+statusTag(s.status)+'</div>'+
    '<div class="meta"><span>'+esc(s.jobName)+'</span><span>任务单号 '+ord+'</span></div>'+
    (s.status==='待审核'?'<div style="margin-top:5px"><button class="btn sm green" onclick="auditSignup(\''+s.id+'\',true)">通过</button> <button class="btn sm red" onclick="auditSignup(\''+s.id+'\',false)">拒绝</button></div>':'')+
    (s.status==='已通过'?'<div style="margin-top:5px"><button class="btn sm orange" onclick="finishSignup(\''+s.id+'\')">✅ 确认服务完成</button></div>':'')+
    '</div>';
  });
  h+=pagerHTML(C.auditPage,list.length,per,'C.auditPage')+'</div>';
  return h;
}
function auditSignup(id,pass){
  const s=DB.signups.find(x=>x.id===id);
  if(pass){
    s.status='已通过';
    DB.records.unshift({id:uid('R'),student:s.student,cls:s.cls,taskName:s.jobName,layer:'社区服务层',source:'job',jobId:s.jobId,duration:60,date:new Date().toISOString().slice(0,10),desc:'（服务任务单已生成，待服务留痕）',media:[],status:'待审核',ai:null,uploader:'社区'});
    toast('已通过，服务任务单已生成','ok');
  }else{ s.status='已拒绝'; const j=DB.jobs.find(x=>x.id===s.jobId); if(j&&j.signed>0)j.signed--; toast('已拒绝该报名','ok'); }
  save();renderComm();
}
function finishSignup(id){ DB.signups.find(x=>x.id===id).status='服务完成'; save(); toast('服务已完成，家长/社区可上传留痕材料','ok'); renderComm(); }
function cUp(){
  const mineIds=DB.jobs.filter(j=>j.owner===OWNER).map(j=>j.id);
  const list=DB.records.filter(r=>r.source==='job'&&mineIds.includes(r.jobId));
  let h='<div class="privacy-tip">🔒 隐私保护提示：上传的照片/视频必须遮挡未成年人面部（马赛克、贴纸等），仅保留劳动场景与动作；素材仅用于本校道法与劳动融合课题教学评价与教研存档，禁止私自转发、对外传播。</div>';
  h+='<div class="card"><h4>⬆️ 上传服务照片 / 视频 / 文档</h4>';
  if(!list.length){h+='<div class="empty">暂无本社区关联的服务任务</div></div>';return h;}
  h+='<label class="f">选择服务任务</label><select id="cuRec">'+list.map(r=>'<option value="'+r.id+'">'+esc(r.student)+'（'+esc(r.cls)+'）· '+esc(r.taskName)+'</option>').join('')+'</select>'+
  '<label class="f">服务说明</label><textarea id="cuDesc" placeholder="描述服务过程与成效…"></textarea>'+
  '<label class="f">照片 / 视频 / 文档</label><input type="file" id="cuFiles" multiple accept="image/*,video/*,.doc,.docx,.pdf" onchange="pickCuFiles(this)">'+
  '<div class="imgrow" id="cuPrev"></div>'+
  '<div class="priv-must"><input type="checkbox" id="cuMask"><span>我已确认：素材已遮挡未成年人面部，仅用于本校课题教研存档。</span></div>'+
  '<div style="text-align:center;margin-top:10px"><button class="btn orange" onclick="uploadComm()">提交留痕材料</button></div></div>';
  // 本端上传的服务记录列表（社区端只能改/删自己上传的）
  const mine=DB.records.filter(r=>r.uploader==='社区');
  const per=4,pg=mine.slice((C.page-1)*per,C.page*per);
  h+='<div class="card"><h4>🗂️ 本端上传的服务记录列表</h4>'+(pg.length?'':'<div class="empty">本端还没有上传过服务记录</div>');
  pg.forEach(r=>{
    h+='<div class="tcard"><div class="tt"><b>'+esc(r.student)+'</b><span class="mini">'+esc(r.cls)+'</span>'+statusTag(r.status)+'</div>'+
    '<div style="font-size:13px">'+esc(r.taskName)+'</div>'+
    '<div class="meta"><span>🏫 '+esc(r.school||'—')+'</span><span>'+esc(r.cls)+'</span><span>⏱ '+r.duration+' 分钟</span><span>📅 '+esc(r.date)+'</span><span>上传：'+esc(r.uploader)+'</span></div>'+
    (r.desc?'<div class="cm">'+esc(r.desc)+'</div>':'')+
    mediaHTML(r)+
    '<div style="margin-top:6px"><button class="btn sm" onclick="editRec(\''+r.id+'\',false)">✏️ 修改</button> <button class="btn sm red" onclick="delRec(\''+r.id+'\')">🗑 删除</button></div></div>';
  });
  h+=pagerHTML(C.page,mine.length,per,'C.page')+'</div>';
  return h;
}
let _cuMedia=[];
function pickCuFiles(inp){
  [...inp.files].forEach(f=>{
    const kind=f.type.startsWith('image')?'img':(f.type.startsWith('video')?'video':'doc');
    if(kind==='img'&&f.size<800*1024){const rd=new FileReader();rd.onload=e=>{_cuMedia.push({kind,name:f.name,url:e.target.result});drawCuPrev();};rd.readAsDataURL(f);}
    else{_cuMedia.push({kind,name:f.name,url:URL.createObjectURL(f),temp:true});drawCuPrev();}
  }); inp.value='';
}
function drawCuPrev(){ const b=$('cuPrev'); if(b)b.innerHTML=_cuMedia.map((m,i)=>'<div class="im">'+(m.kind==='img'?'<img src="'+m.url+'">':'<div style="width:110px;height:80px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px">'+(m.kind==='video'?'🎬 ':'📄 ')+esc(m.name.slice(0,12))+'</div>')+'<button class="del" onclick="_cuMedia.splice('+i+',1);drawCuPrev()">✕</button></div>').join(''); }
function uploadComm(){
  if(!$('cuMask').checked){toast('请先勾选隐私确认','err');return;}
  const desc=$('cuDesc').value.trim(); if(!desc){toast('请填写服务说明','warn');return;}
  const r=DB.records.find(x=>x.id===$('cuRec').value); if(!r)return;
  r.desc=desc; r.media=(r.media||[]).concat(_cuMedia.slice()); r.status='待审核'; r.uploader='社区'; r.school='湛江市第三十三小学';
  _cuMedia=[];save();toast('留痕材料已提交，等待教师审核','ok');renderComm();
}
function cEv(){
  const mineIds=DB.jobs.filter(j=>j.owner===OWNER).map(j=>j.id);
  const list=DB.records.filter(r=>mineIds.includes(r.jobId)||r.layer==='社区服务层');
  const per=4,pg=list.slice((C.evPage-1)*per,C.evPage*per);
  let h='<div class="card"><h4>👀 学生评价（家校社三方共看）</h4>'+(pg.length?'':'<div class="empty">暂无记录</div>');
  pg.forEach(r=>{
    h+='<div class="tcard"><div class="tt"><b>'+esc(r.student)+'</b><span class="mini">'+esc(r.cls)+'</span>'+statusTag(r.status)+'</div>'+
    '<div style="font-size:13px">'+esc(r.taskName)+'</div><div class="meta"><span>⏱ '+r.duration+' 分钟</span><span>📅 '+esc(r.date)+'</span></div>';
    ['学生','家长','教师'].forEach(role=>{
      const e=evalOf(r.id,role);
      h+='<div class="meta"><span>'+({'学生':'🧒','家长':'👨‍👩‍👧','教师':'🏫'}[role])+' '+role+(e?' '+starsShow(e.stars):' 暂无')+'</span></div>'+
      (e&&e.comment?'<div class="cm">'+esc(e.comment)+'</div>':'');
    });
    if(r.ai)h+='<div class="ai-box">🤖 AI评分 '+r.ai.score+'（'+r.ai.level+'）· '+esc(r.ai.sum.c)+'</div>';
    const old=evalOf(r.id,'社区'),key='ce_'+r.id;
    h+='<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:6px"><b style="font-size:12px">🏘️ 社区评价</b>'+(old?' <span class="mini">已提交，可修改自己的评价</span>':'')+
    '<div style="margin:4px 0">'+starInput(key,old?old.stars:0)+'</div>'+
    '<textarea id="tx_'+key+'" placeholder="社区评语…">'+(old?esc(old.comment):'')+'</textarea>'+
    '<div style="text-align:right"><button class="btn sm orange" onclick="commEval(\''+r.id+'\',\''+key+'\')">'+(old?'修改社区评价':'提交社区评价')+'</button></div></div>';
    // 本端已做出的社区评价管理
    if(old&&old.author===OWNER){
      h+='<div style="margin-top:6px"><button class="btn sm" onclick="editEval(\''+old.id+'\')">✏️ 修改</button> <button class="btn sm red" onclick="delEval(\''+old.id+'\')">🗑 删除</button></div>';
    }
    h+='</div>';
  });
  h+=pagerHTML(C.evPage,list.length,per,'C.evPage')+'</div>';
  return h;
}
function commEval(rid,key){
  const stars=_starVals[key]||0,c=$('tx_'+key).value.trim();
  if(!stars){toast('请先打星','warn');return;} if(!c){toast('请填写评语','warn');return;}
  const old=evalOf(rid,'社区');
  if(old){old.stars=stars;old.comment=c;} else DB.evals.push({id:uid('E'),recordId:rid,role:'社区',stars,comment:c,author:OWNER,createdAt:new Date().toISOString().slice(0,10)});
  save();toast('社区评价提交成功','ok');renderComm();
}

/* 点击遮罩关闭弹窗 */
document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));

/* 启动：优先从后端拉取最新云端数据，并建立实时同步（跨设备/跨端无需手动刷新） */
load().then(()=>{ initClassSelects(); bindSync(); }).catch(()=>{ initClassSelects(); bindSync(); });
/* 直接双击打开（file://）时无法连接后端，提示用户改用服务端地址访问，否则数据无法跨设备同步 */
if(location.protocol==='file:'){
  let b=document.getElementById('apiBar');
  if(!b){ b=document.createElement('div'); b.id='apiBar'; b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;font-size:13px;padding:6px;background:#fde2e2;color:#a10000;border-bottom:1px solid #f5b5b5'; document.body.appendChild(b); }
  b.textContent='⚠️ 检测到以本地文件方式打开，未连接服务器，数据无法跨设备同步。请先运行「start.bat」启动服务，再访问 http://localhost:8787';
}
</script>
